name: SwiftBridge
options:
  bundleIdPrefix: com.swiftbridge
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SwiftBridgeCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SwiftBridgeCore
    settings:
      base:
        PRODUCT_NAME: SwiftBridgeCore
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftbridge.SwiftBridgeCore
        ENABLE_TESTABILITY: YES

  SwiftBridgeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SwiftBridgeCoreTests
    dependencies:
      - target: SwiftBridgeCore
    settings:
      base:
        PRODUCT_NAME: SwiftBridgeCoreTests
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftbridge.SwiftBridgeCoreTests
